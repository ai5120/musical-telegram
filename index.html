    :root {

      --primary-light: #fff0e8;
      --dark: #333;
      --gray: #999;
      --bg: #f5f5f5;
      --card-bg: #fff;

      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }

    .app {
      max-width: 480px;
      width: 100%;
      background: var(--bg);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 0 40px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    @media (min-width: 768px) {
      body { padding: 20px; }
      .app { border-radius: 32px; min-height: auto; }
    }

    /* 头部 */
    .header {
      background: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);

    .logo-text {

      font-size: 1.6rem;
      color: var(--primary);

      margin-right: 4px;
    }
    .search-box {
      flex: 1;
      background: #f7f7f7;
      border-radius: 24px;

      align-items: center;
      gap: 6px;
      color: #999;
      font-size: 0.9rem;
    }
    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 0.9rem;
    }
    .header-icons {
      display: flex;
      gap: 16px;
      color: #555;
      font-size: 1.3rem;

    .main-content {

    .page.active {

      overflow: hidden;
      position: relative;
      height: 150px;
      background: #ddd;
    }
    .carousel-track {
      display: flex;
      transition: transform 0.4s ease;
      height: 100%;
    }
    .carousel-slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: white;
      font-weight: bold;
      background: linear-gradient(135deg, #ff6a00, #ee0979);
    }
    .carousel-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
    }
    .dot.active {

      border-radius: 10px;
    }

    /* 分类入口 */
    .category-entry {

    }

      font-size: 1.1rem;

      align-items: center;

    .spec-label {

    .qty-row {

    .detail-actions {

    .btn-add-cart, .btn-buy-now {
      flex: 1;
      padding: 14px;
      border-radius: 30px;
      font-weight: 600;
      border: none;
      font-size: 1rem;
    }
    .btn-add-cart {
      background: #fff0e8;
      color: var(--primary);
      border: 1px solid var(--primary);
    }
    .btn-buy-now {
      background: var(--primary);

    }

    /* 购物车侧栏 */
    .cart-slide {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      max-width: 400px;
      height: 100vh;

      gap: 12px;

    }
    .cart-bottom {
      padding: 16px;
      border-top: 1px solid #eee;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 150;
      display: none;
    }
    .overlay.show {
      display: block;
    }

    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      z-index: 999;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>

    let currentSlide = 0;
    const totalSlides = 3;

    // 轮播初始化
    function initCarousel() {
      carouselDots.innerHTML = '';
      for(let i=0;i<totalSlides;i++){
        const dot = document.createElement('span');
        dot.className = 'dot' + (i===0?' active':'');
        dot.dataset.index = i;
        dot.onclick = ()=> goToSlide(i);
        carouselDots.appendChild(dot);
      }
      setInterval(()=>{ goToSlide((currentSlide+1)%totalSlides); }, 3500);
    }
    function goToSlide(index){
      currentSlide = index;
      bannerTrack.style.transform = `translateX(-${index*100}%)`;
      document.querySelectorAll('.carousel-dots .dot').forEach((d,i)=> d.classList.toggle('active', i===index));
    }

    // 倒计时
    function updateCountdown(){
      const now = new Date();
      const end = new Date(now);
      end.setHours(22,0,0,0);
      if(now>end) end.setDate(end.getDate()+1);
      const diff = end - now;
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      const s = Math.floor((diff%60000)/1000);
      countdownEl.innerHTML = `<span class="time-block">${String(h).padStart(2,'0')}</span>:<span class="time-block">${String(m).padStart(2,'0')}</span>:<span class="time-block">${String(s).padStart(2,'0')}</span>`;
    }
    setInterval(updateCountdown,1000);
    updateCountdown();

    // 渲染秒杀商品
    function renderFlash(){
      const flashGoods = goods.slice(0,4);
      flashItems.innerHTML = flashGoods.map(g=>`
        <div class="flash-item" onclick="openDetail(${g.id})">
          <div class="img-placeholder">${g.icon}</div>
          <div style="font-weight:600;">¥${g.price}</div>
          <div style="text-decoration:line-through;color:#999;">¥${Math.round(g.price*1.3)}</div>
        </div>
      `).join('');
    }

    // 渲染商品网格
    function renderGoodsGrid(container, list){
      container.innerHTML = list.map(g=>`
        <div class="goods-card" onclick="openDetail(${g.id})">
          <div class="goods-img">${g.icon}</div>
          <div class="goods-info">
            <div class="goods-name">${g.name}</div>
            <span class="goods-price">¥${g.price}</span>
            <span class="goods-sold">已售${Math.floor(Math.random()*500)+100}</span>
          </div>
        </div>
      `).join('');
    }

    window.openDetail = function(id){
      const g = goods.find(x=>x.id===id);
      if(!g) return;
      currentDetailGoods = g;
      detailQty = 1;
      selectedColor = g.colors.length? g.colors[0] : null;
      selectedSize = g.sizes.length? g.sizes[0] : null;
      document.getElementById('detailImg').textContent = g.icon;
      document.getElementById('detailName').textContent = g.name;
      document.getElementById('detailPrice').textContent = `¥${g.price}`;
      document.getElementById('qtyValue').textContent = detailQty;
      renderSpecs(g);
      detailModal.classList.add('open');
      overlay.classList.add('show');
    };

    function renderSpecs(g){
      const container = document.getElementById('specContainer');
      let html = '';
      if(g.colors.length){
        html += `<div class="spec-group"><div class="spec-label">颜色</div><div class="spec-options">`;
        g.colors.forEach(c=>{
          html += `<button class="spec-btn ${c===selectedColor?'active':''}" data-type="color" data-val="${c}">${c}</button>`;
        });
        html += `</div></div>`;
      }
      if(g.sizes.length){
        html += `<div class="spec-group"><div class="spec-label">尺寸</div><div class="spec-options">`;
        g.sizes.forEach(s=>{
          html += `<button class="spec-btn ${s===selectedSize?'active':''}" data-type="size" data-val="${s}">${s}</button>`;
        });
        html += `</div></div>`;
      }
      container.innerHTML = html;
      container.querySelectorAll('.spec-btn').forEach(btn=>{
        btn.onclick = function(){
          const type = this.dataset.type;
          const val = this.dataset.val;
          if(type==='color') selectedColor = val;
          else selectedSize = val;
          renderSpecs(g);
        };
      });
    }

    document.getElementById('qtyMinus').onclick = ()=>{ if(detailQty>1){ detailQty--; document.getElementById('qtyValue').textContent=detailQty; } };
    document.getElementById('qtyPlus').onclick = ()=>{ detailQty++; document.getElementById('qtyValue').textContent=detailQty; };
    document.getElementById('detailClose').onclick = closeDetail;
    overlay.onclick = ()=>{ closeDetail(); closeCartSlide(); };

    function closeDetail(){
      detailModal.classList.remove('open');
      overlay.classList.remove('show');
    }

    document.getElementById('detailAddCart').onclick = ()=>{
      if(!currentDetailGoods) return;
      addToCart(currentDetailGoods, detailQty, selectedColor, selectedSize);
      closeDetail();
      showToast('已加入购物车');
    };
    document.getElementById('detailBuyNow').onclick = ()=>{
      if(!currentDetailGoods) return;
      addToCart(currentDetailGoods, detailQty, selectedColor, selectedSize);
      closeDetail();
      openCartSlide();
      showToast('正在前往购物车');
    };

    function addToCart(goods, qty, color, size){
      const cartItem = {
        id: goods.id,
        name: goods.name,
        price: goods.price,
        icon: goods.icon,
        color: color || '',
        size: size || '',
        quantity: qty
      };
      const exist = cart.find(c=> c.id===goods.id && c.color===color && c.size===size);
      if(exist) exist.quantity += qty;
      else cart.push(cartItem);
      updateCartUI();
    }

    function updateCartUI(){
      const totalItems = cart.reduce((s,i)=>s+i.quantity,0);
      navCartBadge.textContent = totalItems;
      renderCartList();
      const total = cart.reduce((s,i)=>s+i.price*i.quantity,0);
      cartTotalPrice.textContent = `¥${total}`;
    }

    function renderCartList(){
      if(cart.length===0){
        cartList.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">购物车是空的</div>';
      } else {
        cartList.innerHTML = cart.map((item,idx)=>`
          <div class="cart-item">
            <div style="font-size:2rem; width:50px;">${item.icon}</div>
            <div style="flex:1;">
              <div style="font-weight:500;">${item.name}</div>
              <div style="color:#999; font-size:0.8rem;">${item.color} ${item.size}</div>
              <div style="color:var(--primary); font-weight:600;">¥${item.price}</div>
              <div style="display:flex; align-items:center; gap:8px;">
                <button onclick="changeCartQty(${idx},-1)">-</button>
                <span>${item.quantity}</span>
                <button onclick="changeCartQty(${idx},1)">+</button>
                <button onclick="removeCartItem(${idx})" style="color:red; border:none; background:none;">删除</button>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    window.changeCartQty = function(idx, delta){
      if(cart[idx].quantity + delta <= 0) cart.splice(idx,1);
      else cart[idx].quantity += delta;
      updateCartUI();
    };
    window.removeCartItem = function(idx){
      cart.splice(idx,1);
      updateCartUI();
    };

    function openCartSlide(){
      cartSlide.classList.add('open');
      overlay.classList.add('show');
    }
    function closeCartSlide(){
      cartSlide.classList.remove('open');
      overlay.classList.remove('show');
    }
    document.getElementById('cartSlideClose').onclick = closeCartSlide;
    document.getElementById('cartCheckoutBtn').onclick = ()=>{
      if(cart.length===0) { showToast('购物车空空如也'); return; }
      showToast('订单已提交！(演示)');
      cart = [];
      updateCartUI();
      closeCartSlide();
    };

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(()=>toast.classList.remove('show'),1500);
    }

    // 页面切换
    navItems.forEach(item=>{
      item.addEventListener('click', function(){
        const page = this.dataset.page;
        if(page==='cart') { openCartSlide(); return; }
        navItems.forEach(n=>n.classList.remove('active'));
        this.classList.add('active');
        pages.forEach(p=>p.classList.remove('active'));
        if(page==='home') document.getElementById('homePage').classList.add('active');
        else if(page==='category') document.getElementById('categoryPage').classList.add('active');
        else if(page==='profile') document.getElementById('profilePage').classList.add('active');
      });
    });

    // 分类页构建
    const categories = ["女装","男装","数码","美妆","家居"];
    const cateSidebar = document.getElementById('cateSidebar');
    const cateDetailGrid = document.getElementById('cateDetailGrid');
    function buildCategoryPage(){
      cateSidebar.innerHTML = categories.map((c,i)=> `<div class="cate-sidebar-item ${i===0?'active':''}" data-cate="${c}">${c}</div>`).join('');
      cateSidebar.querySelectorAll('.cate-sidebar-item').forEach(el=>{
        el.onclick = function(){
          cateSidebar.querySelectorAll('.cate-sidebar-item').forEach(e=>e.classList.remove('active'));
          this.classList.add('active');
          const cate = this.dataset.cate;
          const filtered = goods.filter(g=>g.category===cate);
          renderGoodsGrid(cateDetailGrid, filtered);
        };
      });
      renderGoodsGrid(cateDetailGrid, goods.filter(g=>g.category==='女装'));
    }

    // 搜索
    searchInput.addEventListener('input', function(e){
      const keyword = e.target.value.trim().toLowerCase();
      if(keyword===''){
        renderGoodsGrid(homeGoodsGrid, goods);
        return;
      }
      const filtered = goods.filter(g=>g.name.toLowerCase().includes(keyword));
      renderGoodsGrid(homeGoodsGrid, filtered);
    });

    // 初始化
    initCarousel();
    renderFlash();
    renderGoodsGrid(homeGoodsGrid, goods);
    buildCategoryPage();
    updateCartUI();
  })();
</script>
</body>
</html>
